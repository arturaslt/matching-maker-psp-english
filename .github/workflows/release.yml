name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          
      - name: Build Executable
        run: |
          pyinstaller --onefile --name patcher src/patcher.py
          
      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "dist\patcher.exe" -Destination "release\"
          Copy-Item "BOOT.BIN" -Destination "release\"
          Copy-Item -Path "patches" -Destination "release\patches" -Recurse
          Copy-Item "README.md" -Destination "release\"
          $zipName = "matching-maker-patcher-${{ github.ref_name }}.zip"
          Compress-Archive -Path "release\*" -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Get Tag Message
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # Get the message from the annotated tag
          TAG_MSG=$(git tag -l --format='%(contents:body)' ${{ github.ref_name }})
          # If message is empty (e.g. lightweight tag), fallback to tag subject
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})
          fi
          echo "TAG_MSG<<EOF" >> $GITHUB_ENV
          echo "$TAG_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: ${{ env.TAG_MSG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
